<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Dashboard - Fire Deck</title>
  <link href="//maxcdn.bootstrapcdn.com/bootswatch/3.3.1/paper/bootstrap.min.css" rel="stylesheet">
  <link href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="../../index.css" rel="stylesheet">
  <meta name="theme-color" content="#4caf50">
  <link rel="manifest" href="/manifest.json">
</head>

<body>
  <div class="navbar navbar-default">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand logo" href="/#">Fire Deck.</a>
      </div>
      <div class="navbar-form navbar-right">
        <a href="https://github.com/TreeArtist/FireDeck-1" target="_blank" class="btn btn-info">&nbsp;<i class="fa fa-github"></i>
          &nbsp;
        </a>
        <a href="#" class="btn btn-danger" id="logout">Log out of <b class="usName">[loading]</b></a>
      </div>
    </div>
  </div>

  <div id="mainDash" class="container-fluid">
    <div class="page-header">
      <h1>Student Dashboard
        <small>Logged in as
          <span class="usName"></span>
        </small>
      </h1>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <input type="text" id="ssN" placeholder="Enter Slideshow Alias" class="form-control">
          <br/>
          <span id="ssG" class="btn btn-success form-control" disabled>Go</span>
        </div>
      </div>
      <div class="col-md-6"></div>
    </div>
  </div>

</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  var firebaseConfig = {
    apiKey: "YOUR_FIREBASE_API_KEY",
    authDomain: "firedeck.firebaseapp.com",
    databaseURL: "https://firedeck.firebaseio.com",
    projectId: "firedeck"
  };
  firebase.initializeApp(firebaseConfig);
  var fb = firebase.database().ref();
</script>
<script src="../../uiQuirks.js"></script>
<script src="../dashAuthS.js"></script>
<script src="./index.js"></script>

</html>
